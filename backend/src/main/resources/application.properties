spring.application.name=expense-management

# ============================================
# Active Profile (dev or prod)
# ============================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ============================================
# Server Configuration
# ============================================
server.port=${SERVER_PORT:8081}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api}

# ============================================
# MySQL Database Configuration
# ============================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:moneycare_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ============================================
# JPA Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.use_sql_comments=${JPA_USE_SQL_COMMENTS:false}

# ============================================
# Database migrations
# Existing non-empty databases are marked as baseline version 1, then receive
# all later migrations. New databases execute the full migration history.
# ============================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

# ============================================
# Logging Configuration
# ============================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.dev.expensemanagement=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_HIBERNATE_BINDER:WARN}

# ============================================
# CORS Configuration
# ============================================
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://10.0.2.2:8081}
spring.web.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
spring.web.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
spring.web.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# Multipart uploads used for AI receipt/audio extraction
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

# ============================================
# Security Configuration
# ============================================
spring.security.filter.order=${SECURITY_FILTER_ORDER:5}
app.security.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum}
app.security.jwt-issuer=${JWT_ISSUER:moneycare-api}
app.security.jwt-ttl-seconds=${JWT_TTL_SECONDS:86400}
